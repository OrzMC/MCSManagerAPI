openapi: 3.1.0
info:
  title: MCSManager Panel API
  version: "10"
  description: |
    MCSManager 面板 HTTP API 的**最小可用子集**（OrzMC 的 P2-7 需要的那几个端点）。

    权威来源是官方 apidoc（`MCSManager/Documentation` → `apis/api_instance.md`、`apis/api_daemon.md`），
    官方**没有**提供机器可读的 OpenAPI/Swagger 文件，所以这里按官方文档手写：

    - 文档版本：MCSManager/Documentation @ 287c3936（2026-10-25 取用）
    - 面板实现参考：MCSManager/MCSManager @ ad4f903a（鉴权：`X-Request-API-Key` 头或 `?apikey=`）

    设计口径（与 `swift/lib/ExarotonAPI` 一致）：
    - **保守声明**：只有我们真的依赖的字段才写进 `required`，其余全部可选。
      面板版本之间字段会增删，解码要宽容（未知字段会被 Swift 忽略）；
    - 只覆盖已接入的端点，不做"把官方文档全抄一遍"。加端点时同步更新本文件与 README；
    - **动作 + 控制台**（`/api/protected_instance/*`）只要"这台实例属于你"，普通用户的 key 也能用。

    ⚠️ 该面板要求打开「API Key」功能（`enableApiKey`），否则所有带 key 的请求都会被拒。
servers:
  - url: https://panel.example.com
    description: 由调用方替换成自己的面板地址（`Client(serverURL:)`）。
security:
  - apiKeyHeader: []
paths:
  /api/service/remote_services:
    get:
      operationId: getDaemons
      summary: 节点（守护进程）列表
      description: |
        面板已知的所有 Daemon，每个带 `available`（是否连通）与显示名 `remarks`。
        需要管理员权限。列表项里的 `instances` 概览结构官方未定稿，本 spec 不声明（忽略该字段）。
      responses:
        "200":
          description: 节点列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonListResponse"
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string

  /api/service/remote_service_instances:
    get:
      operationId: getInstances
      summary: 某个节点上的实例列表（含状态）
      description: |
        分页返回某个 Daemon 上的实例；每项含 `status`（-1 busy / 0 stopped / 1 stopping /
        2 starting / 3 running）与 `config`。列表项**不含** `processInfo` / `space`。
      parameters:
        - name: daemonId
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: instance_name
          in: query
          required: false
          description: 按实例显示名模糊过滤
          schema:
            type: string
      responses:
        "200":
          description: 实例分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceListResponse"
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string

  /api/instance:
    get:
      operationId: getInstance
      summary: 单个实例详情
      description: |
        含 `config`（含 Docker 内存上限 `config.docker.memory`）、`info`（玩家数、ping）、
        `processInfo`（CPU / 内存 / 运行时长）与 `status`。
      parameters:
        - name: uuid
          in: query
          required: true
          description: 实例 ID（`instanceUuid`）
          schema:
            type: string
        - name: daemonId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 实例详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetailResponse"
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string

  /api/auth:
    get:
      operationId: getCurrentUser
      summary: 当前用户（含其拥有的实例）
      description: |
        普通用户**唯一**能列实例的入口：管理员的 `/api/service/remote_services` 需要
        `ROLE.ADMIN`，普通账号的 API Key 会被 403。

        - `advanced=true` 时每个实例带 `daemonId` / `status` / `nickname` / `docker` / `info`；
        - 该路由**不套** `{status,data,time}` 外壳，直接返回用户对象；
        - 面板要求 `X-Requested-With: XMLHttpRequest`（`isAjax` 校验），本包中间件已带上；
        - API Key 也能用：面板从 key 反查用户（`getUserUuid`）。
      parameters:
        - name: advanced
          in: query
          required: false
          description: true = 带上实例的完整信息（含状态、Docker 配置、玩家数）
          schema:
            type: boolean
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string

  /api/protected_instance/open:
    get:
      operationId: openInstance
      summary: 启动实例
      description: |
        对应面板「启动」。面板把请求转给节点后立即返回；实例真正起来要再查一次状态。

        **普通用户也能调用**（`/protected_instance` 一组只要"这台实例属于你"，不要求管理员）。
        面板对成功/失败都返回 200 + 空的 JSON 对象或节点回执，所以本 spec 不声明 200 的响应体：
        我们只关心"请求有没有被拒绝"（403/500）。
      parameters:
        - name: daemonId
          in: query
          required: true
          schema:
            type: string
        - name: uuid
          in: query
          required: true
          description: 实例 UUID（**不是**昵称）
          schema:
            type: string
      responses:
        "200":
          description: 已受理（面板立即返回，实例状态随后变化，需重新查询状态）
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能 / 不是这台实例的主人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误 / 节点（守护进程）返回了错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                type: string
  /api/protected_instance/stop:
    get:
      operationId: stopInstance
      summary: 停止实例
      description: |
        对应面板「停止」（会给实例发 `stop`，等它自己退出）。要强制杀进程用 `kill`（本包未封装）。

        **普通用户也能调用**（`/protected_instance` 一组只要"这台实例属于你"，不要求管理员）。
        面板对成功/失败都返回 200 + 空的 JSON 对象或节点回执，所以本 spec 不声明 200 的响应体：
        我们只关心"请求有没有被拒绝"（403/500）。
      parameters:
        - name: daemonId
          in: query
          required: true
          schema:
            type: string
        - name: uuid
          in: query
          required: true
          description: 实例 UUID（**不是**昵称）
          schema:
            type: string
      responses:
        "200":
          description: 已受理（面板立即返回，实例状态随后变化，需重新查询状态）
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能 / 不是这台实例的主人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误 / 节点（守护进程）返回了错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                type: string
  /api/protected_instance/restart:
    get:
      operationId: restartInstance
      summary: 重启实例
      description: |
        对应面板「重启」。

        **普通用户也能调用**（`/protected_instance` 一组只要"这台实例属于你"，不要求管理员）。
        面板对成功/失败都返回 200 + 空的 JSON 对象或节点回执，所以本 spec 不声明 200 的响应体：
        我们只关心"请求有没有被拒绝"（403/500）。
      parameters:
        - name: daemonId
          in: query
          required: true
          schema:
            type: string
        - name: uuid
          in: query
          required: true
          description: 实例 UUID（**不是**昵称）
          schema:
            type: string
      responses:
        "200":
          description: 已受理（面板立即返回，实例状态随后变化，需重新查询状态）
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能 / 不是这台实例的主人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误 / 节点（守护进程）返回了错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                type: string
  /api/protected_instance/command:
    get:
      operationId: sendCommand
      summary: 向实例的控制台发送一条命令
      description: |
        命令走**查询参数**（面板 `validator({ query: { …, command: String } })`），不是请求体。
        命令里出现的 `&` / `=` / 空格由生成的客户端负责百分号编码。

        以 `/` 开头的（如 `/say hi`、`/list`）是 Minecraft 命令；不带 `/` 的是控制台命令
        （如 `stop`）。面板不做校验，原样转给节点。
      parameters:
        - name: daemonId
          in: query
          required: true
          schema:
            type: string
        - name: uuid
          in: query
          required: true
          schema:
            type: string
        - name: command
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已转交（命令是否执行要去看控制台输出）
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能 / 不是这台实例的主人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误 / 节点（守护进程）返回了错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                type: string
  /api/protected_instance/outputlog:
    get:
      operationId: getOutputLog
      summary: 实例控制台的终端输出（最近 N 个字符）
      description: |
        面板返回实例的**原始终端文本**（`Content-Type: text/plain`），不是 JSON；内容是日志
        **尾部**，不带时间戳补全，可能从半行开始 —— 渲染时要当作"最近的一段"而不是完整历史。

        面板按 `size` 截取尾部（支持 `1024` 或 `4kb` 这样的写法）；不传就返回全部（可能很大）。
      parameters:
        - name: daemonId
          in: query
          required: true
          schema:
            type: string
        - name: uuid
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: 只取末尾多少字节/字符，例如 `16384` 或 `16kb`。
          schema:
            type: string
      responses:
        "200":
          description: 控制台文本（尾部）
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: API Key 权限不足 / 未开启 API Key 功能 / 不是这台实例的主人
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            # 面板实际返回 `Content-Type: text/plain` + JSON 文本（协议中间件 JSON.stringify 后
            # 没改 Content-Type），所以两种类型都要声明，否则客户端会判定"类型不匹配"而丢掉文案。
            text/plain:
              schema:
                type: string
        "500":
          description: 面板内部错误 / 节点（守护进程）返回了错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Request-API-Key
      description: |
        面板「用户信息 → API Key」里生成的 key（与账号密码同等权限，勿泄露）。
        面板也接受 `?apikey=` 查询参数；本包用 header（不落 URL、不进日志）。

  schemas:
    ErrorResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          description: HTTP 语义的状态码（403 / 500 …）
        data:
          type: string
          description: 面板给出的错误文案（可能被 i18n 翻译）
        time:
          type: integer
          format: int64

    Daemon:
      type: object
      required:
        - uuid
      properties:
        uuid:
          type: string
        ip:
          type: string
        port:
          type: integer
        prefix:
          type: string
          description: Daemon 的 API 路径前缀
        available:
          type: boolean
          description: 节点是否连通
        remarks:
          type: string
          description: 节点显示名

    DaemonListResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/Daemon"
        time:
          type: integer
          format: int64

    InstanceListResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: integer
        data:
          $ref: "#/components/schemas/InstancePage"
        time:
          type: integer
          format: int64

    InstancePage:
      type: object
      required:
        - data
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        maxPage:
          type: integer
        allTags:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/InstanceDetail"

    InstanceDetailResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: integer
        data:
          $ref: "#/components/schemas/InstanceDetail"
        time:
          type: integer
          format: int64

    CurrentUserResponse:
      type: object
      description: |
        `GET /api/auth` 的响应。**两种形状都要能解**：

        - 老/部分版本：直接返回用户对象 `{uuid, userName, permission, instances, …}`；
        - 新版协议中间件：统一包一层 `{status, data: {…用户对象…}, time}`。

        实测（2026-10-26，面板 10.x）：管理员与普通用户的 key 拿到的都是**带外壳**那种；
        只按"裸用户对象"解会得到 `permission = nil / instances = 空`，
        于是普通用户永远看不到实例。所以这里同时声明两套字段，由调用方把 `data` 优先取出来。
      properties:
        status:
          type: integer
        data:
          $ref: "#/components/schemas/CurrentUserPayload"
        uuid:
          type: string
        userName:
          type: string
        permission:
          type: integer
          description: 0 guest / 1 user / 10 admin（`ROLE`）
        instances:
          type: array
          items:
            $ref: "#/components/schemas/AdvancedInstanceInfo"

    CurrentUserPayload:
      type: object
      description: "GET /api/auth 的外壳里的用户对象（字段同 CurrentUserResponse 的裸形态）。"
      properties:
        uuid:
          type: string
        userName:
          type: string
        permission:
          type: integer
        instances:
          type: array
          items:
            $ref: "#/components/schemas/AdvancedInstanceInfo"

    AdvancedInstanceInfo:
      type: object
      description: |
        `GET /api/auth?advanced=true` 里的一条实例（普通用户视角）：
        已经带 `status` / `nickname` / `docker` / `info`，不需要再逐个查详情。
      required:
        - instanceUuid
        - daemonId
      properties:
        instanceUuid:
          type: string
        daemonId:
          type: string
        nickname:
          type: string
        status:
          type: integer
          description: "-1 busy / 0 stopped / 1 stopping / 2 starting / 3 running"
        hostIp:
          type: string
        remarks:
          type: string
        processType:
          type: string
        stopCommand:
          type: string
        ie:
          type: string
        oe:
          type: string
        endTime:
          type: integer
          format: int64
        lastDatetime:
          type: integer
          format: int64
        docker:
          $ref: "#/components/schemas/DockerConfig"
        info:
          $ref: "#/components/schemas/InstanceInfo"

    InstanceDetail:
      type: object
      required:
        - instanceUuid
        - status
      properties:
        instanceUuid:
          type: string
        status:
          type: integer
          description: "-1 busy / 0 stopped / 1 stopping / 2 starting / 3 running"
        started:
          type: integer
          description: 启动次数
        autoRestarted:
          type: integer
          description: 自动重启次数
        space:
          type: integer
          format: int64
          description: 占用磁盘空间（字节）；列表端点不返回
        config:
          $ref: "#/components/schemas/InstanceConfig"
        info:
          $ref: "#/components/schemas/InstanceInfo"
        processInfo:
          $ref: "#/components/schemas/ProcessInfo"

    InstanceConfig:
      type: object
      description: |
        实例配置。这里只声明 OrzMC 会用到的字段（昵称、内存上限、端口、ping 配置等），
        其余字段由面板返回、被解码忽略。
      properties:
        nickname:
          type: string
        type:
          type: string
          description: 实例类型（universal / minecraft/java …）
        startCommand:
          type: string
        stopCommand:
          type: string
        stopTimeout:
          type: integer
        cwd:
          type: string
        ie:
          type: string
          description: 输入编码
        oe:
          type: string
          description: 输出编码
        createDatetime:
          type: integer
          format: int64
        lastDatetime:
          type: integer
          format: int64
        endTime:
          type: integer
          format: int64
        fileCode:
          type: string
        processType:
          type: string
          description: general / docker
        category:
          type: integer
        basePort:
          type: integer
        runAs:
          type: string
        tag:
          type: array
          items:
            type: string
        enableRcon:
          type: boolean
        rconIp:
          type: string
        rconPort:
          type: integer
        rconPassword:
          type: string
        updateCommand:
          type: string
        java:
          type: object
          properties:
            id:
              type: string
        terminalOption:
          type: object
          properties:
            haveColor:
              type: boolean
            pty:
              type: boolean
            ptyWindowCol:
              type: integer
            ptyWindowRow:
              type: integer
        eventTask:
          type: object
          properties:
            autoStart:
              type: boolean
            autoRestart:
              type: boolean
            autoRestartMaxTimes:
              type: integer
        pingConfig:
          type: object
          description: 面板侧的 ping 探测配置（用来显示在线人数）
          properties:
            ip:
              type: string
            port:
              type: integer
            type:
              type: integer
        docker:
          $ref: "#/components/schemas/DockerConfig"

    DockerConfig:
      type: object
      description: 只在 `processType == docker` 时有意义；这里只声明内存/镜像/端口。
      properties:
        image:
          type: string
        containerName:
          type: string
        memory:
          type: integer
          format: int64
          description: 容器内存上限（MB）
        cpuUsage:
          type: integer
          description: CPU 上限（百分比）
        networkMode:
          type: string
        ports:
          type: array
          items:
            type: string

    InstanceInfo:
      type: object
      properties:
        mcPingOnline:
          type: boolean
        currentPlayers:
          type: integer
        maxPlayers:
          type: integer
        version:
          type: string
        latency:
          type: integer
        fileLock:
          type: integer
        openFrpStatus:
          type: boolean
        playersChart:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
        allocatedPorts:
          type: array
          items:
            type: object
            properties:
              host:
                type: string
              container:
                type: integer
              protocol:
                type: string

    ProcessInfo:
      type: object
      description: 进程资源占用（列表端点不返回）
      properties:
        cpu:
          type: number
          format: double
          description: 百分比（0 ~ 100 × 核数）
        memory:
          type: integer
          format: int64
          description: 字节
        ppid:
          type: integer
        pid:
          type: integer
        ctime:
          type: integer
          format: int64
          description: 用户态 + 内核态时间（毫秒）
        elapsed:
          type: integer
          format: int64
          description: 运行时长（毫秒）
        timestamp:
          type: integer
          format: int64
